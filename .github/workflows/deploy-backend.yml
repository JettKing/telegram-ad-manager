name: deploy-backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:config:check
      - run: pnpm db:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Export production D1 before migration
        id: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          output="backup/tg-ad-manager-production-${stamp}.sql"
          pnpm exec wrangler d1 export tg-ad-manager --remote --skip-confirmation --output "$output" --config wrangler.production.jsonc
          test -s "$output"
          printf 'backup_file=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Validate pre-migration backup
        run: python3 scripts/validate-d1-backup.py "${{ steps.export.outputs.backup_file }}"

      - name: Upload pre-migration backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-d1-pre-migration-${{ github.run_id }}
          path: ${{ steps.export.outputs.backup_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Apply active production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 migrations list tg-ad-manager --remote --config wrangler.production.jsonc
          pnpm exec wrangler d1 migrations apply tg-ad-manager --remote --config wrangler.production.jsonc

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.production.jsonc

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_IDENTITY_ID: ${{ secrets.TELEGRAM_BOT_IDENTITY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.production.jsonc
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.production.jsonc
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET --config wrangler.production.jsonc
          printf '%s' "$TELEGRAM_BOT_IDENTITY_ID" | npx wrangler secret put TELEGRAM_BOT_IDENTITY_ID --config wrangler.production.jsonc

      - name: Verify Telegram Bot identity without exposing token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          EXPECTED_TELEGRAM_BOT_USERNAME: TGAdOpsBot
          EXPECTED_TELEGRAM_BOT_ID: "8600658922"
        run: pnpm exec tsx scripts/verify-telegram-bot.ts
