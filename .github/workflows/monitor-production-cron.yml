name: monitor-production-cron

on:
  schedule:
    # Every 10 minutes; the endpoint returns 503 after 10 minutes without a snapshot.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-liveness:
    runs-on: ubuntu-latest
    steps:
      - name: Check production Cron liveness
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --max-time 20 \
            https://tg-ad-manager-api.huaaplus.workers.dev/api/v1/operations/cron-liveness
